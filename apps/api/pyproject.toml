[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrisense-api"
version = "0.1.0"
description = "NutriSense API - Nutrition That Makes Sense"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.26",
  "python-multipart>=0.0.9",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends/Query/File in defaults is idiomatic
